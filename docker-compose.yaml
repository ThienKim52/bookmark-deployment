version: '3.7'

services:
  redis:
    image: redis:alpine
    container_name: redis

  bookmark_service:
    image: kimthanthien/bookmark:${IMAGE_TAG:-latest}
    restart: always
    container_name: bookmark-service
    depends_on:
      - redis
    env_file:
      - ./bookmark-service/.env

  portal:
    image: ebvn/bookmark-app-portal:dev
    container_name: portal

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
    - "80:80"
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf