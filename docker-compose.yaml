services:
  redis:
    image: redis:alpine
    container_name: redis
  
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: bookmark

  bookmark_service:
    image: kimthanthien/bookmark:v1.0.1
    restart: always
    container_name: bookmark-service
    depends_on:
      - redis
    env_file:
      - ./bookmark-service/.env

  portal:
    image: ebvn/bookmark-app-portal:dev
    container_name: portal

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
    - "80:80"
    volumes:
    - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
  
   